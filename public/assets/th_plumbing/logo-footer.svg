    <text x="0" y="72" font-family="'Plus Jakarta Sans', Impact, Arial Black, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="0.5">&amp; <tspan fill="#FBBF24">HEATING</tspan></text>
