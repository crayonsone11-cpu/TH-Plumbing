    <!-- Droplet Body -->
    <path d="M40 0 C40 0 78 48 78 68 C78 90 61 95 40 95 C19 95 2 90 2 68 C2 48 40 0 40 0 Z" fill="#2563EB" />
    <!-- Droplet Top Aperture/Hole -->
    <circle cx="40" cy="18" r="4.5" fill="#FFFFFF" />
    <!-- Text TH inside drop -->
    <text x="40" y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">TH</text>
